# ~/.ragger/settings.ini — Ragger configuration
#
# Every Ragger install is per-user; this file is the single source of truth.
# It is created automatically by install.sh if missing. Edit in place.
#
# Uncommented lines are the shipped defaults. Commented lines (# ...) show
# optional settings and illustrative examples — uncomment and adjust.
#
# This file aims to document EVERY recognized key. Server-locked keys (port,
# db_path, embedding model/dimensions/vector_type, socket, system ceilings)
# are read from the system/bootstrap config and ignored from per-user overrides.

# =====================================================================
# Server
# =====================================================================
[server]
socket = ~/.ragger/ragger.sock   # Unix domain socket — comment out or set to '' to disable
# bind = 127.0.0.1               # TCP bind address — uncomment to also serve over TCP
port   = 8432                     # TCP port (used when `bind` is set)
# Both listeners can run at the same time. If `socket` and `bind` are both
# empty/missing, the daemon falls back to bind = 127.0.0.1.
# server_name = ragger.local      # hostname for cpp-httplib (optional)

# Turn handling (both default off):
#   capture_turns  WRITE side — accept agent-pushed turns (capture_turn tool /
#                  POST /turn) into the `turns` table.
#   build_context  READ side  — assemble a session's turns into a context
#                  payload (build_context tool / GET /session/<id>). Only
#                  meaningful when capture_turns is also on.
# Agent-driven search/store are always available, independent of these.
capture_turns = false
build_context = false
default_recipe = natural_fading      # recipe applied when caller omits one
# recipes_dir = ~/.ragger/recipes    # JSON recipes; built-ins used if absent

# =====================================================================
# Storage
# =====================================================================
[storage]
db_path     = ~/.ragger/memories.db
formats_dir = ~/.ragger/formats

# =====================================================================
# Embedding
# =====================================================================
# model + dimensions + vector_type define the DB's vector identity and are
# recorded in the DB. Changing any of them once the DB holds data requires
# 'ragger rebuild-embeddings' to re-encode everything.
[embedding]
model       = all-MiniLM-L6-v2
dimensions  = 384
vector_type = f16              # on-disk vector precision: f16 (half) or f32
# model_dir defaults to ~/.ragger/models/<model-name>/

# =====================================================================
# Search
# =====================================================================
[search]
default_limit     = 5
default_min_score = 0.4
bm25_enabled      = true
# Weights are ratios — don't need to sum to 1.0. "3 and 7" == "0.3 and 0.7"
bm25_weight   = 3
vector_weight = 7
# max_search_limit = 0    # system ceiling on default_limit (0 = no ceiling)

# =====================================================================
# Inference  (used only for summarization — there is no chat surface)
# =====================================================================
[inference]
model      =                          # model used for L2/L3 summarization
api_url    = http://localhost:1234/v1 # default: LM Studio convention
api_key    =
max_tokens = 4096
# When the endpoint is unreachable the summarizer falls back to a tagged
# `draft` L2 row (trimmed user+assistant) and housekeeping rewrites it
# with a real summary once inference is back.

# =====================================================================
# Embedder executor (the spawned `ragger embed` subprocess pool)
# =====================================================================
[embed]
timeout_ms  = 10000  # per-embed subprocess timeout
retries     = 1      # retries on a failed/timed-out embed
max_workers = 8      # cap on concurrent embed subprocesses

# =====================================================================
# TLS (for remote/HTTPS exposure)
# =====================================================================
[tls]
# cert =                   # path to TLS certificate chain (PEM)
# key  =                   # path to TLS private key (PEM)

# =====================================================================
# Logging
# =====================================================================
[logging]
log_file = ~/.ragger/activity.log
# Log Levels: trace, debug, info, warn, error, and critical
log_level = warn
# log_dir   =              # log directory (default: ~/.ragger, daemon: /var/log/ragger)
# Per-stream log toggles (separate files):
# query_log = true         # query log
# http_log  = true         # HTTP request log
# mcp_log   = true         # MCP request log
# debug_log = false        # opt-in verbose tracing (per-chunk, etc.)

# =====================================================================
# Housekeeping
# =====================================================================
[housekeeping]
# cleanup_max_age_hours = 336   # raw-turn lifetime (default 336 = 2 weeks; 0 = keep forever)
# housekeeping_interval = 60    # seconds between passes (0 disables)

# =====================================================================
# Import
# =====================================================================
[import]
minimum_chunk_size = 300

# =====================================================================
# Paths
# =====================================================================
[paths]
normalize_home = true          # replace /Users/<you> with ~ in stored paths

# =====================================================================
# Model aliases (short names → full model IDs, for inference model routing)
# =====================================================================
[models]
# opus    = claude-opus-4
# sonnet  = claude-sonnet-4-5
# coder   = Qwen2.5-Coder-14B-Instruct-Q4_K_M.gguf
