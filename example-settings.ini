# ~/.ragger/settings.ini — Ragger configuration
#
# Every Ragger install is per-user; this file is the single source of truth.
# It is created automatically by install.sh if missing. Edit in place.
#
# Uncommented lines are the shipped defaults. Commented lines (# ...) show
# optional settings and illustrative examples — uncomment and adjust.
#
# This file aims to document EVERY recognized key. Server-locked keys (port,
# embedding model/dimensions/vector_type, socket, system ceilings)
# are read from the system/bootstrap config and ignored from per-user overrides.
#
# Note: every on-disk location Ragger uses (database, models, recipes,
# formats, log file, token, stats) is hardcoded relative to ~/.ragger — none
# of it is independently configurable here. The only way to relocate the
# whole tree is the hidden --ragger-base CLI flag (testing only). If you
# need Ragger's data on a different disk, symlink ~/.ragger there instead.

# =====================================================================
# Server
# =====================================================================
[server]
socket_enable = true             # Unix domain socket at ~/.ragger/ragger.sock
# bind = 127.0.0.1                # TCP bind address — uncomment to also serve over TCP
port   = 8432                     # TCP port (used when `bind` is set)
# Both listeners can run at the same time. If socket_enable is false and
# `bind` is empty/missing, the daemon falls back to bind = 127.0.0.1 so
# there's always at least one listener. A malformed `bind` value is a
# startup error (invalid IPv4/IPv6/hostname).
# server_name = ragger.local      # hostname for cpp-httplib (optional)

# TLS — only relevant if you expose Ragger beyond localhost (e.g. bind to a
# LAN/public address, or reverse-proxy from a remote machine). Both must be
# set to enable native TLS; leave both unset to serve plain HTTP.
# cert = /path/to/fullchain.pem   # TLS certificate chain (PEM)
# key  = /path/to/privkey.pem     # TLS private key (PEM)

# Turn handling — capture_turns (WRITE side) accepts agent-pushed turns
# (capture_turn tool / POST /turn) into the `turns` table. Agent-driven
# search/store are always available, independent of this.
capture_turns = true

# =====================================================================
# Embedding
# =====================================================================
# model + dimensions + vector_type define the DB's vector identity and are
# recorded in the DB. Changing any of them once the DB holds data requires
# 'ragger rebuild-embeddings' to re-encode everything.
[embedding]
model       = all-MiniLM-L6-v2
dimensions  = 384
vector_type = f16              # on-disk vector precision: f16 (half) or f32

# =====================================================================
# Search
# =====================================================================
[search]
default_limit     = 5
default_min_score = 0.4
bm25_enabled      = true
# Weights are ratios — don't need to sum to 1.0. "3 and 7" == "0.3 and 0.7"
bm25_weight   = 4
vector_weight = 8
# Phonetic "sounds-like" (dolphining) weight — matches on how a phrase SOUNDS
# (Double Metaphone) alongside meaning (vector) and keywords (bm25). 0 disables.
phon_weight   = 1
max_search_limit = 0    # system ceiling on default_limit (0 = no ceiling)

# =====================================================================
# Summarizer (inference endpoint used for L2/L3 summarization)
# =====================================================================
[summarizer]
model      = qwen3-4b-instruct-2507   # model used for L2/L3 summarization
api_url    = http://localhost:1234/v1 # default: LM Studio convention
api_key    =
max_tokens = 1024
target_pct = 40    # target summary length as % of raw turn; 0 = 30%
max_pct    = 60    # hard cap as % of raw turn; 0 = 60%
# When the endpoint is unreachable the summarizer falls back to a tagged
# `draft` L2 row (trimmed user+assistant) and housekeeping rewrites it
# with a real summary once inference is back.

# System prompt sent to the summarizer model.
# Leave empty (or omit) to use the built-in default below.
# Any non-empty value is passed through verbatim.
# Set to a single space to suppress the system prompt entirely.
# Two {} placeholders are required for target chars and hard cap.
prompt = "Distill this conversation into a compact memory entry. Capture what was decided, built, or resolved — omit greetings, filler, and anything that won't matter later. Write in third person past tense. Target {} characters; hard cap {}. If the exchange is trivial (a greeting, a single command), respond with one short phrase or word."

# =====================================================================
# Embedder executor (the spawned `ragger embed` subprocess pool)
# =====================================================================
[embed]
timeout_ms  = 10000  # per-embed subprocess timeout
retries     = 1      # retries on a failed/timed-out embed
max_workers = 8      # cap on concurrent embed subprocesses

# =====================================================================
# Logging
# =====================================================================
[logging]
log_level = warn
# Log Levels: trace, debug, info, warn, error, and critical
# Everything (query/HTTP/MCP/general) goes to the one activity log —
# there are no separate per-stream log files or toggles.

log_max_size_mb  = 1     # rotate activity.log -> activity.log.<timestamp>
                         # once it reaches this size (MB). 0 disables
                         # size-based rotation. Built into Ragger itself —
                         # no external tool (logrotate/newsyslog) or root
                         # needed; works the same on macOS/Linux/Windows.
log_max_age_days = 14    # delete rotated backups older than this many
                         # days. Never touches the live activity.log.
                         # 0 disables age-based cleanup (backups
                         # accumulate forever). Checked opportunistically
                         # right after each rotation.

# =====================================================================
# Housekeeping
# =====================================================================
[housekeeping]
cleanup_max_age_hours = 0     # raw-turn lifetime (0 = keep forever, default; set to hours to auto-purge)
housekeeping_interval = 60    # seconds between passes (0 disables)
episode_idle_minutes  = 15    # idle gap (min) that closes an episode of work
                              # within a session (also drives session/project
                              # rollups). Any positive int; default 15.
summary_pause_minutes = 20    # DEPRECATED alias for episode_idle_minutes,
                              # honored only when episode_idle_minutes is unset.
catch_up_batch_size   = 10    # per-tick cap on unsummarized turns / draft
                              # retries enqueued at once. Keeps a manual
                              # resummarize (nulling model_id on a batch of
                              # `summaries` rows via direct SQL) to a small,
                              # deliberate slice per housekeeping tick instead
                              # of redoing hundreds of inference calls at
                              # once. Any positive int; default 10.

# =====================================================================
# Import
# =====================================================================
[import]
minimum_chunk_size = 300

# =====================================================================
# Paths
# =====================================================================
[paths]
normalize_home = true          # replace /Users/<you> with ~ in stored paths
