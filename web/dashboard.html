<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ragger Memory Dashboard</title>
<style>
  :root {
    --bg: #f6f8fa; --panel: #ffffff; --border: #d1d9e0;
    --text: #24292f; --muted: #57606a; --accent: #0969da;
    --ok-bg: #dafbe1; --ok-fg: #1a7f37; --err-bg: #ffebe9; --err-fg: #cf222e;
    --warn-bg: #fff8c5; --warn-fg: #9a6700; --info-bg: #ddf4ff; --info-fg: #0969da;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }
  /* ---- header ---- */
  .header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0; gap: 16px;
  }
  .header h1 { font-size: 18px; font-weight: 600; margin: 0; white-space: nowrap; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .badge {
    padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500;
    background: var(--info-bg); color: var(--info-fg); white-space: nowrap;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .badge.down { background: var(--err-bg); color: var(--err-fg); }
  /* ---- body: sidebar + main ---- */
  .body { display: flex; flex: 1; min-height: 0; }
  .sidebar {
    width: 200px; background: var(--panel); border-right: 1px solid var(--border);
    padding: 12px 0; overflow-y: auto; flex-shrink: 0;
  }
  .tab {
    padding: 10px 20px; cursor: pointer; font-weight: 500; color: var(--muted);
    border-left: 3px solid transparent; user-select: none;
  }
  .tab:hover { background: var(--bg); color: var(--text); }
  .tab.active { background: var(--bg); color: var(--text); border-left-color: var(--accent); }
  .main { flex: 1; overflow-y: auto; padding: 20px 24px; min-width: 0; }
  .panel-title { font-size: 20px; font-weight: 600; margin: 0 0 16px;
    padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  /* ---- setting rows ---- */
  .row {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 20px; padding: 14px 0; border-bottom: 1px solid #eaeef2;
  }
  .row .info { flex: 1; min-width: 0; }
  .row .label { font-weight: 500; font-size: 15px; }
  .row .key { font-family: 'SF Mono', Monaco, monospace; font-size: 12px;
    color: var(--muted); margin-left: 8px; }
  .row .help { font-size: 13px; color: var(--muted); line-height: 1.4;
    margin-top: 4px; max-width: 560px; }
  .row .control { flex-shrink: 0; display: flex; flex-direction: column;
    align-items: flex-end; gap: 6px; }
  input[type=text], select, textarea {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; font-family: inherit; background: #fff; transition: box-shadow .15s, border-color .15s;
  }
  input[type=text] { width: 200px; }
  textarea { width: 320px; resize: vertical; }
  select { width: 160px; }
  input:disabled, select:disabled, textarea:disabled { background: #f0f1f3; color: var(--muted); }
  .flash-ok { border-color: var(--ok-fg) !important; box-shadow: 0 0 0 3px var(--ok-bg); }
  .flash-err { border-color: var(--err-fg) !important; box-shadow: 0 0 0 3px var(--err-bg); }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
  .tag.locked { background: #eaeef2; color: var(--muted); }
  .tag.rebuild { background: var(--warn-bg); color: var(--warn-fg); }
  .tag.restart { background: var(--info-bg); color: var(--info-fg); }
  .cb { width: 18px; height: 18px; }
  /* trash-can reset: shown only when a field differs from its default */
  .reset {
    border: none; background: none; cursor: pointer; padding: 2px 4px;
    font-size: 14px; line-height: 1; color: var(--muted); border-radius: 4px;
  }
  .reset:hover { background: var(--err-bg); color: var(--err-fg); }
  .ctl-line { display: flex; align-items: center; gap: 6px; }
  /* embedding panel banner */
  .embed-banner {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 14px 16px; margin-bottom: 20px;
  }
  .embed-banner .cur { font-size: 14px; color: var(--muted); }
  .embed-banner .cur b { color: var(--text); font-family: 'SF Mono', Monaco, monospace; }
  .embed-row { display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-top: 10px; }
  .embed-status { font-size: 14px; font-weight: 500; }
  .embed-status.ok { color: var(--ok-fg); }
  .embed-status.pending { color: var(--warn-fg); }
  .embed-status.busy { color: var(--info-fg); }
  .btn {
    padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
    cursor: pointer;
  }
  .btn:disabled { background: #94a3b8; cursor: not-allowed; opacity: .7; }
  /* ---- activity ---- */
  .activity {
    height: 160px; flex-shrink: 0; background: var(--panel);
    border-top: 1px solid var(--border); display: flex; flex-direction: column;
  }
  .activity h2 { font-size: 13px; font-weight: 600; color: var(--muted);
    margin: 0; padding: 8px 20px; border-bottom: 1px solid #eaeef2; text-transform: uppercase; letter-spacing: .5px; }
  .activity ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1;
    font-family: 'SF Mono', Monaco, monospace; font-size: 12px; }
  .activity li { padding: 4px 20px; border-bottom: 1px solid #f6f8fa; color: var(--text); white-space: pre-wrap; }
  /* ---- error banner ---- */
  .banner { background: var(--err-bg); color: var(--err-fg); padding: 10px 20px;
    font-size: 14px; display: none; }
  .banner.show { display: block; }
</style>
</head>
<body>
  <div class="header">
    <h1>Ragger Memory Dashboard</h1>
    <div class="badges" id="badges">
      <span class="badge down" id="server-badge">Server: connecting…</span>
    </div>
  </div>

  <div class="banner" id="banner"></div>

  <div class="body">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="main"></div>
  </div>

  <div class="activity">
    <h2>Recent Activity</h2>
    <ul id="activity"></ul>
  </div>

<script>
"use strict";

// ---- token & fetch helpers -------------------------------------------------
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const qs = TOKEN ? ("?token=" + encodeURIComponent(TOKEN)) : "";

function api(path) { return path + qs; }

// Fixed section order + pretty labels (mirrors the C++ schema sections).
const SECTIONS = [
  ["server", "Server"],
  ["embedding", "Embedding"],
  ["search", "Search"],
  ["summarizer", "Summarizer"],
  ["logging", "Logging"],
  ["housekeeping", "Housekeeping"],
  ["import", "Import"],
];

let CONFIG = [];          // array of entries from /config
let activeSection = SECTIONS[0][0];

function showBanner(msg) {
  const b = document.getElementById("banner");
  b.textContent = msg; b.classList.add("show");
}

// ---- load config and build the UI -----------------------------------------
async function loadConfig() {
  let data;
  try {
    const r = await fetch(api("/config"));
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
  } catch (e) {
    showBanner("Could not load configuration from the server: " + e.message);
    return;
  }
  CONFIG = data.config || [];
  buildTabs();
  renderSection(activeSection);
}

function buildTabs() {
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = "";
  // Only show sections that actually have entries.
  const present = new Set(CONFIG.map(e => e.section));
  for (const [key, label] of SECTIONS) {
    if (!present.has(key)) continue;
    const div = document.createElement("div");
    div.className = "tab" + (key === activeSection ? " active" : "");
    div.textContent = label;
    div.onclick = () => {
      activeSection = key;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      div.classList.add("active");
      renderSection(key);
    };
    sidebar.appendChild(div);
  }
}

function renderSection(section) {
  const main = document.getElementById("main");
  const label = (SECTIONS.find(s => s[0] === section) || [section, section])[1];
  main.innerHTML = "";
  const title = document.createElement("h2");
  title.className = "panel-title";
  title.textContent = label;
  main.appendChild(title);

  // The Server tab gets a restart banner (bound-vs-configured port + button).
  if (section === "server") {
    const banner = document.createElement("div");
    banner.className = "embed-banner";
    banner.id = "restart-banner";
    banner.innerHTML =
      '<div class="cur" id="restart-current">Checking listener status…</div>' +
      '<div class="embed-row">' +
        '<span class="embed-status" id="restart-status"></span>' +
        '<button class="btn" id="restart-btn" disabled>Restart now</button>' +
      '</div>';
    main.appendChild(banner);
    document.getElementById("restart-btn").onclick = doRestart;
    refreshRestart();
  }

  // The Embedding tab gets a special banner (current identity + Update now).
  if (section === "embedding") {
    const banner = document.createElement("div");
    banner.className = "embed-banner";
    banner.id = "embed-banner";
    banner.innerHTML =
      '<div class="cur" id="embed-current">Loading embedding status…</div>' +
      '<div class="embed-row">' +
        '<span class="embed-status" id="embed-status"></span>' +
        '<button class="btn" id="embed-update" disabled>Update now</button>' +
      '</div>';
    main.appendChild(banner);
    document.getElementById("embed-update").onclick = doEmbeddingUpdate;
    refreshEmbedding();
    populateModelChoices();

    // External engine: Connect button + status line (inserted after banner)
    const extPanel = document.createElement("div");
    extPanel.className = "embed-banner";
    extPanel.id = "ext-connect-panel";
    extPanel.innerHTML =
      '<div class="embed-row">' +
        '<span class="embed-status" id="ext-connect-status"></span>' +
        '<button class="btn" id="ext-connect-btn" style="display:none">Connect</button>' +
      '</div>';
    main.appendChild(extPanel);
    document.getElementById("ext-connect-btn").onclick = connectExternal;

    // HuggingFace download panel (visible for internal engine)
    const hfPanel = document.createElement("div");
    hfPanel.className = "embed-banner";
    hfPanel.id = "hf-download-panel";
    hfPanel.innerHTML =
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">' +
        '<input type="text" id="hf-search" placeholder="Search HuggingFace embedding models…" style="flex:1">' +
        '<button class="btn" id="hf-search-btn">Search</button>' +
      '</div>' +
      '<div id="hf-results"></div>' +
      '<div class="embed-row">' +
        '<span class="embed-status" id="hf-status"></span>' +
      '</div>';
    main.appendChild(hfPanel);
    document.getElementById("hf-search-btn").onclick = searchHuggingFace;
    document.getElementById("hf-search").addEventListener("keydown",
      (e) => { if (e.key === "Enter") searchHuggingFace(); });
  }

  for (const entry of CONFIG.filter(e => e.section === section)) {
    const rowEl = renderRow(entry);
    entry.__row = rowEl;
    main.appendChild(rowEl);
  }

  // After rendering rows, apply engine-based visibility for embedding tab.
  if (section === "embedding") {
    updateEngineVisibility();
  }

  // Summarizer tab: populate model dropdown from the inference endpoint.
  if (section === "summarizer") {
    populateSummarizerModels();
  }
}

// ---- embedding panel -------------------------------------------------------
let EMBED_STATUS = null;

async function refreshEmbedding() {
  try {
    const r = await fetch(api("/embedding/status"));
    if (!r.ok) return;
    EMBED_STATUS = await r.json();
  } catch (e) { return; }
  renderEmbeddingBanner();
  // Refresh trashcan visibility for all desired_embedding_* fields since
  // their comparison depends on the current values in EMBED_STATUS.
  for (const entry of CONFIG) {
    if (entry.key in DESIRED_TO_CURRENT) updateResetVisibility(entry);
  }
}

function renderEmbeddingBanner() {
  const s = EMBED_STATUS;
  const cur = document.getElementById("embed-current");
  const st = document.getElementById("embed-status");
  const btn = document.getElementById("embed-update");
  if (!s || !cur) return;
  const c = s.current || {};
  cur.innerHTML = "Current vectors: <b>" + escapeHtml(c.model) + "</b> · " +
    escapeHtml(c.vector_type) + " · " + escapeHtml(String(c.dimensions)) + "-dim" +
    " · engine: <b>" + escapeHtml(c.engine || "internal") + "</b>";
  if (s.reembedding) {
    st.className = "embed-status busy";
    st.textContent = "Re-embedding in progress… search is paused.";
    btn.disabled = true; btn.textContent = "Updating…";
  } else if (s.needs_update) {
    st.className = "embed-status pending";
    st.textContent = "Needs re-embedding — desired settings differ from current.";
    btn.disabled = false; btn.textContent = "Update now";
  } else {
    st.className = "embed-status ok";
    st.textContent = "Up to date.";
    btn.disabled = true; btn.textContent = "Update now";
  }
}

async function doEmbeddingUpdate() {
  const btn = document.getElementById("embed-update");
  btn.disabled = true; btn.textContent = "Starting…";
  try {
    await fetch(api("/embedding/update"), { method: "POST" });
  } catch (e) {}
  refreshEmbedding();
}

// Fill the Desired Model dropdown from the models directory (GET /models).
// Response format: {models: [{name:"display", path:"provider/model"}, ...]}
async function populateModelChoices() {
  let models = [];
  try {
    const r = await fetch(api("/models"));
    if (r.ok) models = (await r.json()).models || [];
  } catch (e) { return; }
  const entry = CONFIG.find(e => e.key === "desired_embedding_model");
  if (!entry || !entry.__field || entry.__field.tagName !== "SELECT") return;
  const sel = entry.__field;
  const chosen = entry.value;
  sel.innerHTML = "";
  for (const m of models) {
    const o = document.createElement("option");
    // path is the canonical value stored in config; name is the display label.
    o.value = m.path || m; o.textContent = m.name || m;
    if ((m.path || m) === chosen) o.selected = true;
    sel.appendChild(o);
  }
  // When model selection changes, commit + fetch model info for dimensions.
  sel.onchange = async () => {
    await commit(entry, sel.value, sel);
    fetchModelDimensions(sel.value);
  };
  // Fetch dimensions for the currently selected model on first load.
  if (sel.value) fetchModelDimensions(sel.value);
}

// Fetch local model config.json to get native dimensions, then update the
// desired_embedding_dimensions field. For non-MRL models the field is locked
// to the native size; for MRL it would allow free input (future).
async function fetchModelDimensions(modelPath) {
  const dimsEntry = CONFIG.find(e => e.key === "desired_embedding_dimensions");
  if (!dimsEntry || !dimsEntry.__field) return;
  try {
    const r = await fetch(api("/models/info") +
      (qs ? "&" : "?") + "path=" + encodeURIComponent(modelPath));
    if (!r.ok) return;
    const data = await r.json();
    if (data.dimensions) {
      dimsEntry.__field.value = String(data.dimensions);
      dimsEntry.__field.disabled = true;  // locked to native size (non-MRL)
      commit(dimsEntry, String(data.dimensions), dimsEntry.__field);
    }
  } catch (e) { /* model info unavailable */ }
}

// ---- HuggingFace model search & download -----------------------------------
async function searchHuggingFace() {
  const q = (document.getElementById("hf-search") || {}).value || "";
  const st = document.getElementById("hf-status");
  const results = document.getElementById("hf-results");
  if (st) { st.textContent = "Searching…"; st.className = "embed-status busy"; }
  if (results) results.innerHTML = "";

  try {
    const r = await fetch(api("/models/huggingface") +
      (qs ? "&" : "?") + "q=" + encodeURIComponent(q));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const models = data.models || [];
    if (models.length === 0) {
      if (st) { st.textContent = "No ONNX embedding models found."; st.className = "embed-status pending"; }
      return;
    }
    if (st) { st.textContent = models.length + " model(s) found."; st.className = "embed-status ok"; }

    // Render results as a list with download buttons.
    if (results) {
      for (const m of models) {
        const row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eaeef2";
        const label = document.createElement("span");
        label.style.cssText = "font-size:14px;font-family:'SF Mono',Monaco,monospace";
        label.textContent = m.id + (m.downloads ? "  (" + humanCount(m.downloads) + "↓)" : "");
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.style.cssText = "padding:4px 12px;font-size:12px";
        btn.textContent = "Download";
        btn.onclick = () => downloadHFModel(m.id, btn, st);
        row.appendChild(label);
        row.appendChild(btn);
        results.appendChild(row);
      }
    }
  } catch (e) {
    if (st) { st.textContent = "Search failed: " + e.message; st.className = "embed-status pending"; }
  }
}

async function downloadHFModel(repo, btn, st) {
  btn.disabled = true; btn.textContent = "Downloading…";
  if (st) { st.textContent = "Downloading " + repo + "…"; st.className = "embed-status busy"; }
  try {
    const r = await fetch(api("/models/download"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ repo }),
    });
    const data = await r.json();
    if (!r.ok) {
      btn.disabled = false; btn.textContent = "Retry";
      if (st) { st.textContent = "Failed: " + (data.error || "unknown error"); st.className = "embed-status pending"; }
      return;
    }
    btn.textContent = data.status === "already_present" ? "Already present" : "✓ Downloaded";
    if (st) { st.textContent = "✓ " + repo + " ready."; st.className = "embed-status ok"; }
    // Refresh the local model dropdown so the new model appears.
    populateModelChoices();
  } catch (e) {
    btn.disabled = false; btn.textContent = "Retry";
    if (st) { st.textContent = "Download failed: " + e.message; st.className = "embed-status pending"; }
  }
}

// Fill the Summarizer Model field from the summarizer/inference endpoint.
// Queries GET /models/summarizer and replaces the text input with a dropdown.
async function populateSummarizerModels() {
  let models = [];
  try {
    const r = await fetch(api("/models/summarizer"));
    if (r.ok) models = (await r.json()).models || [];
  } catch (e) { return; }
  const entry = CONFIG.find(e => e.key === "summarizer_model");
  if (!entry || !entry.__field) return;
  const field = entry.__field;
  const parent = field.parentNode;
  // Replace text input with a select populated from the endpoint.
  const sel = document.createElement("select");
  sel.style.width = "200px";
  const chosen = entry.value;
  // Always offer a blank option (use default / leave empty).
  if (models.length === 0) {
    const o = document.createElement("option");
    o.value = chosen; o.textContent = chosen || "(no models found)";
    o.selected = true;
    sel.appendChild(o);
  } else {
    for (const m of models) {
      const o = document.createElement("option");
      o.value = m; o.textContent = m;
      if (m === chosen) o.selected = true;
      sel.appendChild(o);
    }
  }
  sel.onchange = () => commit(entry, sel.value, sel);
  parent.replaceChild(sel, field);
  entry.__field = sel;
}

// ---- engine-aware visibility -----------------------------------------------
// Keys only meaningful for internal engine:
const INTERNAL_KEYS = ["desired_embedding_model"];
// Keys only meaningful for external engine:
const EXTERNAL_KEYS = ["embedding_external_host", "embedding_external_port",
                       "embedding_external_api_key", "embedding_external_model"];
// Keys shown for both but may need different behavior:
// desired_embedding_dimensions, desired_embedding_vector_type — always visible

function updateEngineVisibility() {
  const engineEntry = CONFIG.find(e => e.key === "desired_embedding_engine");
  const engine = engineEntry ? engineEntry.value : "internal";
  const isExternal = engine === "external";

  for (const entry of CONFIG) {
    if (!entry.__row) continue;
    if (INTERNAL_KEYS.includes(entry.key)) {
      entry.__row.style.display = isExternal ? "none" : "";
    } else if (EXTERNAL_KEYS.includes(entry.key)) {
      entry.__row.style.display = isExternal ? "" : "none";
    }
  }

  // Show/hide the Connect button
  const connectBtn = document.getElementById("ext-connect-btn");
  if (connectBtn) connectBtn.style.display = isExternal ? "" : "none";
  const connectPanel = document.getElementById("ext-connect-panel");
  if (connectPanel) connectPanel.style.display = isExternal ? "" : "none";
  const hfPanel = document.getElementById("hf-download-panel");
  if (hfPanel) hfPanel.style.display = isExternal ? "none" : "";

  // Engine switch: refresh the model list for the newly selected engine and
  // re-resolve dimensions from whichever model is selected under it.
  if (isExternal) {
    populateExternalModelChoices();   // probes dims for the selected model
  } else {
    populateModelChoices();           // fetches dims for the selected model
  }
}

// Populate the External Model field from the local inference endpoint,
// filtered to embedding models only.
async function populateExternalModelChoices() {
  let models = [];
  try {
    const r = await fetch(api("/models/embedding-external"));
    if (r.ok) models = (await r.json()).models || [];
  } catch (e) { return; }
  const entry = CONFIG.find(e => e.key === "embedding_external_model");
  if (!entry || !entry.__field) return;
  const field = entry.__field;
  const parent = field.parentNode;
  // Replace text input with a select if not already one.
  const sel = (field.tagName === "SELECT") ? field : document.createElement("select");
  sel.style.width = "200px";
  const chosen = entry.value;
  sel.innerHTML = "";
  if (models.length === 0) {
    const o = document.createElement("option");
    o.value = chosen; o.textContent = chosen || "(no embedding models found)";
    o.selected = true;
    sel.appendChild(o);
  } else {
    for (const m of models) {
      const o = document.createElement("option");
      o.value = m; o.textContent = m;
      if (m === chosen) o.selected = true;
      sel.appendChild(o);
    }
  }
  sel.onchange = async () => {
    await commit(entry, sel.value, sel);
    probeExternalModelDimensions(sel.value);
  };
  if (field.tagName !== "SELECT") {
    parent.replaceChild(sel, field);
    entry.__field = sel;
  }
  // Probe dimensions for the currently selected model on first load.
  if (sel.value && models.length > 0) probeExternalModelDimensions(sel.value);
}

// Probe an external embedding model via the configured inference endpoint.
async function probeExternalModelDimensions(model) {
  const dimsEntry = CONFIG.find(e => e.key === "desired_embedding_dimensions");
  if (!dimsEntry || !dimsEntry.__field) return;
  try {
    const r = await fetch(api("/models/embedding-external/probe"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model }),
    });
    if (!r.ok) return;
    const data = await r.json();
    // Warn when the endpoint served a different model than requested —
    // the dimensions then belong to the served model, not the chosen one.
    const st = document.getElementById("ext-connect-status");
    if (data.model_mismatch) {
      if (st) {
        st.textContent = "⚠ Endpoint served '" + data.served_model +
          "' instead of '" + model + "' — dimensions reflect the served model.";
        st.className = "embed-status pending";
      }
    } else if (st && st.textContent.indexOf("⚠") === 0) {
      st.textContent = ""; st.className = "embed-status";
    }
    if (data.dimensions) {
      dimsEntry.__field.value = String(data.dimensions);
      dimsEntry.__field.disabled = true;
      commit(dimsEntry, String(data.dimensions), dimsEntry.__field);
    }
  } catch (e) { /* probe failed */ }
}

// Connect to external endpoint: fetch model list, populate external model dropdown
async function connectExternal() {
  const hostEntry = CONFIG.find(e => e.key === "embedding_external_host");
  const portEntry = CONFIG.find(e => e.key === "embedding_external_port");
  const keyEntry = CONFIG.find(e => e.key === "embedding_external_api_key");
  const modelEntry = CONFIG.find(e => e.key === "embedding_external_model");

  const host = hostEntry ? (hostEntry.__field ? hostEntry.__field.value : hostEntry.value) : "";
  const port = portEntry ? (portEntry.__field ? portEntry.__field.value : portEntry.value) : "";
  const key = keyEntry ? (keyEntry.__field ? keyEntry.__field.value : keyEntry.value) : "";

  if (!host || !port) {
    const st = document.getElementById("ext-connect-status");
    if (st) { st.textContent = "Host and port required."; st.className = "embed-status pending"; }
    return;
  }

  const btn = document.getElementById("ext-connect-btn");
  const st = document.getElementById("ext-connect-status");
  if (btn) { btn.disabled = true; btn.textContent = "Connecting…"; }
  if (st) { st.textContent = ""; st.className = "embed-status"; }

  try {
    const url = api("/models/external") +
      (qs ? "&" : "?") + "host=" + encodeURIComponent(host) +
      "&port=" + encodeURIComponent(port) +
      (key ? "&key=" + encodeURIComponent(key) : "");
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    const models = data.models || [];

    if (models.length === 0) {
      if (st) { st.textContent = "Connected but no models found."; st.className = "embed-status pending"; }
    } else {
      if (st) { st.textContent = "Connected — " + models.length + " model(s) found."; st.className = "embed-status ok"; }
    }

    // Populate the external model field as a dropdown
    if (modelEntry && modelEntry.__field) {
      const field = modelEntry.__field;
      const parent = field.parentNode;
      // Replace text input with a select
      const sel = document.createElement("select");
      sel.style.width = "200px";
      const chosen = modelEntry.value;
      for (const m of models) {
        const o = document.createElement("option");
        o.value = m; o.textContent = m;
        if (m === chosen) o.selected = true;
        sel.appendChild(o);
      }
      sel.onchange = async () => {
        await commit(modelEntry, sel.value, sel);
        // Auto-probe dimensions when model is selected
        probeExternalDimensions(host, port, sel.value, key);
      };
      parent.replaceChild(sel, field);
      modelEntry.__field = sel;

      // Auto-probe if a model is already selected
      if (models.length > 0) {
        const selectedModel = sel.value || models[0];
        probeExternalDimensions(host, port, selectedModel, key);
      }
    }
  } catch (e) {
    if (st) { st.textContent = "Connection failed: " + e.message; st.className = "embed-status pending"; }
  }
  if (btn) { btn.disabled = false; btn.textContent = "Connect"; }
}

async function probeExternalDimensions(host, port, model, key) {
  const dimsEntry = CONFIG.find(e => e.key === "desired_embedding_dimensions");
  if (!dimsEntry || !dimsEntry.__field) return;

  try {
    const r = await fetch(api("/models/external/probe"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ host, port: parseInt(port), model, key }),
    });
    if (!r.ok) return;
    const data = await r.json();
    if (data.dimensions) {
      dimsEntry.__field.value = String(data.dimensions);
      commit(dimsEntry, String(data.dimensions), dimsEntry.__field);
    }
  } catch (e) { /* probe failed silently */ }
}

// ---- server restart panel --------------------------------------------------
let RESTART_STATUS = null;

async function refreshRestart() {
  try {
    const r = await fetch(api("/restart/status"));
    if (!r.ok) return;
    RESTART_STATUS = await r.json();
  } catch (e) { return; }
  renderRestartBanner();
  // Refresh trashcan visibility for server keys that compare against bound state.
  for (const entry of CONFIG) {
    if (entry.key in DESIRED_TO_CURRENT) updateResetVisibility(entry);
  }
}

function renderRestartBanner() {
  const s = RESTART_STATUS;
  const cur = document.getElementById("restart-current");
  const st = document.getElementById("restart-status");
  const btn = document.getElementById("restart-btn");
  if (!s || !cur) return;
  cur.innerHTML = "Listening on <b>" + escapeHtml(s.bound_bind) + ":" +
    escapeHtml(String(s.bound_port)) + "</b>";
  if (s.needs_restart) {
    st.className = "embed-status pending";
    st.textContent = "Restart required — configured " +
      s.configured_bind + ":" + s.configured_port +
      " differs from the running listener.";
    btn.disabled = false; btn.textContent = "Restart now";
  } else {
    st.className = "embed-status ok";
    st.textContent = "Running with the current network settings.";
    btn.disabled = true; btn.textContent = "Restart now";
  }
}

async function doRestart() {
  const st = document.getElementById("restart-status");
  const btn = document.getElementById("restart-btn");
  btn.disabled = true; btn.textContent = "Restarting…";
  let reconnect = null;
  try {
    const r = await fetch(api("/restart"), { method: "POST" });
    const d = await r.json();
    reconnect = d.reconnect_url;
  } catch (e) {}
  if (!reconnect) {
    // Fall back to the current origin with the (new) configured port.
    const s = RESTART_STATUS || {};
    reconnect = (s.scheme || location.protocol.replace(":", "")) + "://" +
      location.hostname + ":" + (s.configured_port || location.port) + "/dashboard";
  }
  st.className = "embed-status busy";
  st.textContent = "Daemon is restarting… reconnecting to " + reconnect;
  const target = reconnect + (qs ? qs : "");
  const probe = reconnect.replace("/dashboard", "/health") + (qs ? qs : "");
  // Poll the new listener until it answers, then redirect the browser. The
  // probe is cross-origin when the port changed (:oldport -> :newport), so a
  // normal fetch is CORS-blocked and can't read the status. Use no-cors: a
  // reachable server resolves the promise (opaque response), an unreachable
  // one throws (connection refused). "Resolved without throwing" == up.
  let tries = 0;
  const poll = async () => {
    tries++;
    try {
      await fetch(probe, { mode: "no-cors", cache: "no-store" });
      location.href = target;   // resolved -> the new listener is answering
      return;
    } catch (e) { /* not up yet */ }
    if (tries > 60) {  // ~30s
      st.className = "embed-status pending";
      st.textContent = "Could not reconnect automatically. Open " + target + " manually.";
      return;
    }
    setTimeout(poll, 500);
  };
  // Give the old listener a moment to drop before polling the new one.
  setTimeout(poll, 1500);
}

// ---- one setting row -------------------------------------------------------
function renderRow(entry) {
  const row = document.createElement("div");
  row.className = "row";

  const info = document.createElement("div");
  info.className = "info";
  const lab = document.createElement("div");
  lab.className = "label";
  lab.innerHTML = escapeHtml(entry.label) + '<span class="key">' + escapeHtml(entry.key) + '</span>';
  info.appendChild(lab);
  if (entry.help) {
    const help = document.createElement("div");
    help.className = "help";
    help.textContent = entry.help;
    info.appendChild(help);
  }
  row.appendChild(info);

  const control = document.createElement("div");
  control.className = "control";

  const line = document.createElement("div");
  line.className = "ctl-line";
  const field = buildControl(entry);

  // Trash-can undo: reverts the field to its PREVIOUS value (one-step undo).
  // Shown only when there is a prior value to go back to and the field is
  // editable. Clicking commits the previous value.
  const reset = document.createElement("button");
  reset.className = "reset";
  reset.title = "Revert to current value";
  reset.textContent = "🗑";
  reset.style.visibility = "hidden";
  reset.onclick = () => {
    // For desired/bind keys: revert to the current running value.
    const mapper = DESIRED_TO_CURRENT[entry.key];
    if (mapper) {
      const cur = mapper();
      if (cur !== undefined) commit(entry, String(cur), field, /*isUndo=*/true);
      return;
    }
    // For all other keys: one-step undo to previous value.
    if (entry.__prev === undefined) return;
    const target = entry.__prev;
    entry.__prev = undefined;
    commit(entry, target, field, /*isUndo=*/true);
  };

  entry.__field = field;
  entry.__reset = reset;
  updateResetVisibility(entry);

  line.appendChild(field);
  if (entry.edit !== "locked") line.appendChild(reset);
  control.appendChild(line);

  // edit-class tag / note
  const note = document.createElement("div");
  if (entry.edit === "locked") note.innerHTML = '<span class="tag locked">locked</span>';
  else if (entry.edit === "rebuild") note.innerHTML = '<span class="tag rebuild">rebuild required</span>';
  else if (entry.edit === "restart") note.innerHTML = '<span class="tag restart">restart required</span>';
  control.appendChild(note);

  row.appendChild(control);
  return row;
}

// Map "desired" keys to their current counterpart, drawn from live status objects.
// Embedding keys read from EMBED_STATUS; server keys read from RESTART_STATUS.
const DESIRED_TO_CURRENT = {
  "desired_embedding_model":       () => EMBED_STATUS?.current?.model,
  "desired_embedding_engine":      () => EMBED_STATUS?.current?.engine,
  "desired_embedding_dimensions":  () => EMBED_STATUS?.current ? String(EMBED_STATUS.current.dimensions) : undefined,
  "desired_embedding_vector_type": () => EMBED_STATUS?.current?.vector_type,
  "desired_port":                  () => RESTART_STATUS ? String(RESTART_STATUS.bound_port) : undefined,
  "bind":                          () => RESTART_STATUS?.bound_bind,
};

// Show the trash-can when a field differs from its reference value:
// For desired_embedding_* keys: compare against the CURRENT embedding identity.
// For all other keys: compare against the previous value (one-step undo).
function updateResetVisibility(entry) {
  if (!entry.__reset) return;
  let showReset = false;
  const mapper = DESIRED_TO_CURRENT[entry.key];
  if (mapper) {
    const cur = mapper();
    showReset = cur !== undefined && String(cur) !== String(entry.value);
  } else {
    showReset = entry.__prev !== undefined &&
                String(entry.__prev) !== String(entry.value);
  }
  entry.__reset.style.visibility = (showReset && entry.edit !== "locked")
    ? "visible" : "hidden";
}

function buildControl(entry) {
  const locked = entry.edit === "locked";
  const t = entry.type;

  if (t === "boolean") {
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.className = "cb";
    cb.checked = entry.value === "true";
    cb.disabled = locked;
    cb.onchange = () => commit(entry, cb.checked ? "true" : "false", cb);
    return cb;
  }

  if (t === "enum") {
    const sel = document.createElement("select");
    sel.disabled = locked;
    for (const opt of (entry.options || [])) {
      const o = document.createElement("option");
      o.value = opt; o.textContent = opt;
      if (opt === entry.value) o.selected = true;
      sel.appendChild(o);
    }
    sel.onchange = () => commit(entry, sel.value, sel);
    return sel;
  }

  if (t === "text") {
    const ta = document.createElement("textarea");
    ta.rows = 4; ta.value = entry.value; ta.disabled = locked;
    ta.dataset.prev = entry.value;
    ta.onchange = () => commit(entry, ta.value, ta);
    return ta;
  }

  // integer / float / string / path -> text input
  const inp = document.createElement("input");
  inp.type = "text"; inp.value = entry.value; inp.disabled = locked;
  inp.dataset.prev = entry.value;

  // Character filtering for numeric fields: strip disallowed chars on input.
  if (t === "integer" || t === "float") {
    const allowed = t === "integer" ? /[^0-9-]/g : /[^0-9.\-]/g;
    inp.addEventListener("input", () => {
      const clean = inp.value.replace(allowed, "");
      if (clean !== inp.value) inp.value = clean;
    });
  }
  // Commit on Enter or blur/change.
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") inp.blur(); });
  inp.onchange = () => commit(entry, inp.value, inp);
  return inp;
}

// ---- commit a change to the server ----------------------------------------
async function commit(entry, value, field, isUndo) {
  try {
    const r = await fetch(api("/config/" + entry.key), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: value }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      flash(field, false);
      revert(entry, field);
      return;
    }
    // Success: server returns the resolved value (blank -> default).
    const oldValue = entry.value;
    entry.value = data.value !== undefined ? data.value : value;
    // Record the value we just moved away from so the trash-can can undo to
    // it (one-step undo). Skip when this commit IS the undo — the click
    // already consumed the history so the button hides afterward.
    if (!isUndo && String(oldValue) !== String(entry.value)) entry.__prev = oldValue;
    if (field.type === "checkbox") field.checked = entry.value === "true";
    else if ("value" in field) field.value = entry.value;
    if ("dataset" in field) field.dataset.prev = entry.value;
    // Update restart/rebuild note from response flags, trash-can, and (for
    // embedding keys) the embedding panel's needs-update indicator.
    updateNote(entry, data);
    updateResetVisibility(entry);
    if (entry.key.indexOf("desired_embedding") === 0) refreshEmbedding();
    if (entry.key === "desired_embedding_engine") updateEngineVisibility();
    if (entry.key === "desired_port" || entry.key === "bind") refreshRestart();
    flash(field, true);
  } catch (e) {
    flash(field, false);
    revert(entry, field);
  }
}

function revert(entry, field) {
  const prev = field.dataset ? field.dataset.prev : undefined;
  if (field.type === "checkbox") field.checked = entry.value === "true";
  else if (prev !== undefined) field.value = prev;
}

function updateNote(entry, data) {
  const note = entry && entry.__noteEl;
  // (Notes are static per edit-class; nothing dynamic needed for now.)
}

function flash(field, ok) {
  const cls = ok ? "flash-ok" : "flash-err";
  field.classList.add(cls);
  setTimeout(() => field.classList.remove(cls), 800);
}

// ---- live status + activity via SSE ---------------------------------------
function connectEvents() {
  let es;
  try {
    es = new EventSource(api("/events"));
  } catch (e) {
    return;
  }
  es.addEventListener("stats", (ev) => {
    try { updateStats(JSON.parse(ev.data)); } catch (e) {}
    // Refresh the embedding banner if that tab is open, so re-embed progress
    // and completion show live without a manual poll.
    if (activeSection === "embedding") refreshEmbedding();
  });
  es.addEventListener("activity", (ev) => {
    try { addActivity(JSON.parse(ev.data).line); } catch (e) {}
  });
  es.onerror = () => {
    setServerBadge(false);
    // EventSource auto-reconnects; just reflect the state.
  };
}

function updateStats(s) {
  setServerBadge((s.status || "") === "running");
  const badges = document.getElementById("badges");
  // Rebuild all badges: server + one per table + version.
  badges.innerHTML = "";
  const sb = document.createElement("span");
  sb.className = "badge ok"; sb.textContent = "Server: running";
  sb.id = "server-badge";
  badges.appendChild(sb);
  const tables = s.tables || {};
  for (const name of Object.keys(tables)) {
    const b = document.createElement("span");
    b.className = "badge";
    b.textContent = name + ": " + tables[name].toLocaleString();
    badges.appendChild(b);
  }
  if (s.version) {
    const v = document.createElement("span");
    v.className = "badge"; v.textContent = "v" + s.version;
    badges.appendChild(v);
  }
}

function setServerBadge(up) {
  const b = document.getElementById("server-badge");
  if (!b) return;
  b.className = "badge " + (up ? "ok" : "down");
  b.textContent = up ? "Server: running" : "Server: disconnected";
}

const MAX_ACTIVITY = 200;
function addActivity(line) {
  if (!line) return;
  const ul = document.getElementById("activity");
  const li = document.createElement("li");
  li.textContent = line;
  ul.appendChild(li);
  while (ul.children.length > MAX_ACTIVITY) ul.removeChild(ul.firstChild);
  ul.scrollTop = ul.scrollHeight;  // auto-scroll to newest
}

// ---- util ------------------------------------------------------------------
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

// Human-readable count: 256M, 1.2M, 15K, 842
function humanCount(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "K";
  return String(n);
}

// Human-readable bytes: 127 MB, 1.2 GB, 42 KB
function humanBytes(b) {
  if (b >= 1e9) return (b / 1e9).toFixed(1) + " GB";
  if (b >= 1e6) return (b / 1e6).toFixed(0) + " MB";
  if (b >= 1e3) return (b / 1e3).toFixed(0) + " KB";
  return b + " B";
}

// ---- boot ------------------------------------------------------------------
loadConfig();
connectEvents();
